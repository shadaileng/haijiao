name = "haijiao-worker"
compatibility_date = "2025-01-01"
main = "worker.ts"

[observability]
logs = { enabled = true }

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
serve_directly = false

[vars]
HAIJIAO_API_BASE = "https://haijiao.com"

[[d1_databases]]
binding = "P2P_DB"
database_name = "haijiao-p2p"
# 不填 database_id，部署后在 Dashboard 绑定
